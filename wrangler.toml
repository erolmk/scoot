name = "rideon"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
routes = [
  { pattern = "seamengine.com/scoot*", zone_name = "seamengine.com" },
  { pattern = "www.seamengine.com/scoot*", zone_name = "seamengine.com" },
  { pattern = "seamengine.com/rideon*", zone_name = "seamengine.com" },
  { pattern = "www.seamengine.com/rideon*", zone_name = "seamengine.com" },
]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"

[ai]
binding = "AI"

[vars]
MODEL = "claude-opus-4-7"

[[d1_databases]]
binding = "DB"
database_name = "scoot-events"
database_id = "13a9aca9-3bb5-4e0e-b2a9-5d039594fbf2"
