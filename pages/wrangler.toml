# Second address for the same app, off seamengine.com: https://scootusc.pages.dev (Cloudflare Pages, advanced mode).
# deploy.sh copies public/scoot/* into ./dist and worker.js in as _worker.js, so the AI checks run here too.
name = "scootusc"
pages_build_output_dir = "./dist"
compatibility_date = "2025-09-01"

[ai]
binding = "AI"

[vars]
MODEL = "claude-opus-4-7"

[[d1_databases]]
binding = "DB"
database_name = "scoot-events"
database_id = "13a9aca9-3bb5-4e0e-b2a9-5d039594fbf2"
